<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaloliddin do'koni Katalogi</title>
    
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #27ae60;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e0e0e0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .header {
            text-align: center;
            background: linear-gradient(135deg, #1e272e, #2c3e50);
            color: white;
            padding: 25px 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        .header h1 { 
            margin: 0 0 8px 0; 
            font-size: 32px; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .header .owner-name {
            font-size: 18px;
            font-weight: 600;
            color: #f1c40f;
            margin-bottom: 6px;
        }
        .header .phone-numbers { 
            font-size: 16px; 
            font-weight: 600; 
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }
        .header .phone-numbers a {
            color: #ffffff;
            text-decoration: none;
        }
        .header .phone-numbers a:hover {
            text-decoration: underline;
        }
        .header p { margin: 0; opacity: 0.85; font-size: 14px; }

        .json-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .btn-json {
            background-color: #8e44ad;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn-json:hover { background-color: #732d91; }

        .btn-print {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }
        .btn-print:hover { background-color: #d35400; }

        .btn-telegram {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }
        .btn-telegram:hover { background-color: #006699; }
        .telegram-icon {
            width: 18px;
            height: 18px;
            fill: white;
        }

        .btn-add-cat {
            background-color: #2980b9;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-add-cat:hover { background-color: #1b6391; }

        .summary-card {
            position: sticky; top: 15px; z-index: 100;
            background: #ffffff; border: 2px solid var(--accent-color);
            border-radius: 12px; padding: 15px 25px; margin-bottom: 25px;
            box-shadow: 0 4px 20px rgba(39, 174, 96, 0.15);
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 15px;
        }
        .summary-title { font-size: 18px; font-weight: 600; color: var(--primary-color); }
        .summary-values { display: flex; gap: 25px; align-items: center; }
        .stat-item { text-align: right; }
        .stat-label { font-size: 12px; color: #7f8c8d; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-value { font-size: 22px; font-weight: 700; color: var(--accent-color); }
        .btn-clear {
            background-color: #e74c3c; color: white; border: none; padding: 8px 16px;
            border-radius: 6px; cursor: pointer; font-weight: 600; transition: background 0.2s;
        }
        .btn-clear:hover { background-color: #c0392b; }

        .search-card {
            background: #ffffff; border: 2px solid #3498db; border-radius: 12px;
            padding: 12px 15px; margin-bottom: 20px; display: flex; gap: 10px;
            align-items: center; box-shadow: 0 3px 12px rgba(52, 152, 219, 0.10);
        }
        .search-input {
            flex: 1; min-width: 0; padding: 11px 13px; border: 1px solid #d5dce0;
            border-radius: 7px; font-size: 15px; outline: none; box-sizing: border-box;
        }
        .btn-search-clear {
            background: #3498db; color: white; border: none; padding: 10px 14px;
            border-radius: 7px; cursor: pointer; font-weight: 600; white-space: nowrap;
        }

        .categories-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 20px;
        }
        .category-card {
            background: var(--card-bg); border-radius: 10px; padding: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid var(--border-color);
        }
        .category-title {
            font-size: 17px; font-weight: 700; color: var(--primary-color);
            border-bottom: 2px solid #3498db; padding-bottom: 8px; margin-top: 0;
            margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;
        }
        .editable {
            outline: none;
            padding: 2px 4px;
            border-radius: 4px;
        }
        .editable:hover, .editable:focus {
            background-color: #f0f7ff;
            border: 1px dashed #3498db;
        }

        .product-table { width: 100%; border-collapse: collapse; }
        .product-table th {
            text-align: left; font-size: 11px; color: #7f8c8d; text-transform: uppercase;
            padding-bottom: 8px; border-bottom: 1px solid #eee;
        }
        .product-table td {
            padding: 8px 4px; border-bottom: 1px solid #f8f9fa; font-size: 13px; vertical-align: middle;
        }
        .product-number {
            width: 30px; text-align: center !important; font-weight: 700; color: #3498db;
        }
        .product-name { font-weight: 500; color: #2c3e50; padding-right: 8px; }
        .input-box {
            width: 65px; padding: 5px 6px; border: 1px solid var(--border-color);
            border-radius: 5px; font-size: 13px; outline: none;
        }
        .input-box:focus {
            border-color: #3498db;
            box-shadow: 0 0 4px rgba(52, 152, 219, 0.4);
        }
        .row-sum {
            font-weight: 600; color: var(--primary-color); text-align: right; white-space: nowrap;
        }

        .btn-action {
            background: none; border: none; cursor: pointer; font-size: 14px; padding: 2px 5px;
        }
        .btn-add-item {
            margin-top: 10px; background: #e8f8f5; color: #27ae60; border: 1px dashed #27ae60;
            width: 100%; padding: 6px; border-radius: 6px; cursor: pointer; font-weight: 600;
        }
        .btn-add-item:hover { background: #d1f2eb; }

        .category-card.hidden, .product-row.hidden { display: none; }
        .no-results {
            display: none; text-align: center; padding: 30px; background: white;
            border-radius: 10px; border: 1px solid var(--border-color); color: #7f8c8d;
        }

        @media (max-width: 600px) {
            .search-card, .summary-card { flex-direction: column; align-items: stretch; }
            .summary-values { justify-content: space-between; }
            .categories-grid { grid-template-columns: 1fr; }
        }

        @media print {
            .json-controls, .search-card, .btn-clear, .btn-action, .btn-add-item {
                display: none !important;
            }
            .summary-card {
                position: static;
                box-shadow: none;
                border: 1px solid #000;
            }
            body {
                background-color: #fff;
                padding: 0;
            }
            .category-card {
                box-shadow: none;
                border: 1px solid #ccc;
                page-break-inside: avoid;
            }
            .input-box {
                border: none;
                background: transparent;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Jaloliddin do'koni</h1>
        <div class="phone-numbers">
            📞 <a href="tel:+998999834444">+998 99 983 44 44</a> | <a href="tel:+998999857070">+998 99 985 70 70</a>
        </div>
        <p>Tahrirlanadigan Interaktiv Katalog</p>
    </div>

    <div class="json-controls">
        <button class="btn-telegram" onclick="sendToTelegram()">
            <svg class="telegram-icon" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.02-1.96 1.25-5.54 3.69-.52.36-1 .53-1.42.52-.47-.01-1.37-.26-2.03-.48-.82-.27-1.47-.42-1.42-.88.03-.24.38-.49 1.07-.75 4.19-1.82 6.98-3.02 8.38-3.6 3.98-1.65 4.81-1.94 5.35-1.95.12 0 .38.03.55.17.14.12.18.28.2.45-.02.07-.02.16-.04.22z"/>
            </svg>
            Telegramga Jo'natish
        </button>

        <button class="btn-print" onclick="window.print()">🖨️ Chop etish (Pechat)</button>
        <button class="btn-add-cat" onclick="addNewCategory()">➕ Yangi Kategoriya Qo'shish</button>
        <button class="btn-json" onclick="downloadJSON()">💾 Bazani yuklab olish</button>
        <button class="btn-json" onclick="document.getElementById('fileInput').click()">📂 Bazani ochish</button>
        <input type="file" id="fileInput" accept=".json" style="display: none;" onchange="uploadJSON(event)">
    </div>

    <div class="search-card">
        <input type="text" id="searchInput" class="search-input" placeholder="🔎 Mahsulotni qidirish..." oninput="searchProducts()">
        <button class="btn-search-clear" onclick="clearSearch()">Qidiruvni tozalash</button>
    </div>

    <div class="summary-card">
        <div class="summary-title">Umumiy Hisob</div>
        <div class="summary-values">
            <div class="stat-item">
                <div class="stat-label">Umumiy Summa (So'm)</div>
                <div class="stat-value" id="grandTotal">0 so'm</div>
            </div>
            <button class="btn-clear" onclick="clearAllInputs()">Shtukalarni nollash</button>
        </div>
    </div>

    <div class="categories-grid" id="catalogContainer"></div>
    <div class="no-results" id="noResults">🔎 Mahsulot topilmadi.</div>

    <script>
        const defaultCatalog = [
            {
                categoryUz: "1. Yangi Kategoriya",
                items: []
            }
        ];

        let catalogData = JSON.parse(localStorage.getItem('catalogData')) || defaultCatalog;

        function renderCatalog() {
            const container = document.getElementById('catalogContainer');
            let html = '';
            let globalIndex = 0;

            if (catalogData.length === 0) {
                container.innerHTML = `<div style="text-align: center; width: 100%; color: #7f8c8d; padding: 20px;">Hali kategoriyalar qo'shilmadi. "Yangi Kategoriya Qo'shish" tugmasini bosing.</div>`;
                calculateGrandTotal();
                return;
            }

            catalogData.forEach((cat, catIdx) => {
                html += `
                    <div class="category-card" data-cat-idx="${catIdx}">
                        <div class="category-title">
                            <div>
                                <span class="editable" contenteditable="true" onblur="updateCategoryName(${catIdx}, this.innerText)">${cat.categoryUz}</span>
                            </div>
                            <button class="btn-action" title="Kategoriyani o'chirish" onclick="deleteCategory(${catIdx})">❌</button>
                        </div>
                        <table class="product-table">
                            <thead>
                                <tr>
                                    <th class="product-number">№</th>
                                    <th>Mahsulot</th>
                                    <th style="width: 65px;">Narxi</th>
                                    <th style="width: 50px;">Soni</th>
                                    <th style="text-align: right; width: 65px;">Jami</th>
                                    <th style="width: 20px;"></th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                cat.items.forEach((item, itemIdx) => {
                    globalIndex++;
                    const price = item.price || 0;
                    const count = item.count || 0;
                    const sum = price * count;

                    html += `
                        <tr class="product-row" data-cat="${catIdx}" data-item="${itemIdx}">
                            <td class="product-number">${globalIndex}</td>
                            <td class="product-name">
                                <span class="editable" contenteditable="true" onblur="updateItemName(${catIdx}, ${itemIdx}, this.innerText)">${item.uz}</span>
                            </td>
                            <td>
                                <input type="number" min="0" value="${price || ''}" placeholder="0" class="input-box" oninput="updateValue(${catIdx}, ${itemIdx}, 'price', this.value)" onkeydown="handleNavigation(event, this, ${catIdx})">
                            </td>
                            <td>
                                <input type="number" min="0" value="${count || ''}" placeholder="0" class="input-box" oninput="updateValue(${catIdx}, ${itemIdx}, 'count', this.value)" onkeydown="handleNavigation(event, this, ${catIdx})">
                            </td>
                            <td class="row-sum" id="sum_${catIdx}_${itemIdx}">${sum.toLocaleString()}</td>
                            <td>
                                <button class="btn-action" onclick="deleteItem(${catIdx}, ${itemIdx})">🗑️</button>
                            </td>
                        </tr>
                    `;
                });

                html += `
                            </tbody>
                        </table>
                        <button class="btn-add-item" onclick="addNewItem(${catIdx})">➕ Yangi mahsulot</button>
                    </div>
                `;
            });

            container.innerHTML = html;
            calculateGrandTotal();
        }

        function handleNavigation(event, currentInput, catIdx) {
            const key = event.key;
            if (!['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter'].includes(key)) return;

            const inputs = Array.from(document.querySelectorAll('.input-box'));
            const currentIndex = inputs.indexOf(currentInput);
            if (currentIndex === -1) return;

            event.preventDefault(); // Brauzerning standart harakatini to'xtatish

            // ENTER tugmasi: Kataklar bo'ylab birma-bir ketma-ket yurish
            if (key === 'Enter') {
                if (currentIndex + 1 < inputs.length) {
                    inputs[currentIndex + 1].focus();
                    inputs[currentIndex + 1].select();
                } else {
                    addNewItem(catIdx);
                    setTimeout(() => {
                        const updatedInputs = document.querySelectorAll('.input-box');
                        const newTarget = updatedInputs[currentIndex + 1];
                        if (newTarget) {
                            newTarget.focus();
                            newTarget.select();
                        }
                    }, 50);
                }
            } 
            // O'NGGA Strelka
            else if (key === 'ArrowRight') {
                if (currentIndex + 1 < inputs.length) {
                    inputs[currentIndex + 1].focus();
                    inputs[currentIndex + 1].select();
                }
            } 
            // CHAPGA Strelka
            else if (key === 'ArrowLeft') {
                if (currentIndex - 1 >= 0) {
                    inputs[currentIndex - 1].focus();
                    inputs[currentIndex - 1].select();
                }
            } 
            // PASTGA Strelka: Xuddi shu ustundagi pastki katakka o'tish (2 ga sakrash)
            else if (key === 'ArrowDown') {
                if (currentIndex + 2 < inputs.length) {
                    inputs[currentIndex + 2].focus();
                    inputs[currentIndex + 2].select();
                }
            } 
            // TEPAGA Strelka: Xuddi shu ustundagi yuqoridagi katakka o'tish (2 ga qaytish)
            else if (key === 'ArrowUp') {
                if (currentIndex - 2 >= 0) {
                    inputs[currentIndex - 2].focus();
                    inputs[currentIndex - 2].select();
                }
            }
        }

        function updateValue(catIdx, itemIdx, field, val) {
            const numVal = parseFloat(val) || 0;
            catalogData[catIdx].items[itemIdx][field] = numVal;
            
            const price = catalogData[catIdx].items[itemIdx].price || 0;
            const count = catalogData[catIdx].items[itemIdx].count || 0;
            
            document.getElementById(`sum_${catIdx}_${itemIdx}`).innerText = (price * count).toLocaleString();
            
            saveToLocalStorage();
            calculateGrandTotal();
        }

        function updateCategoryName(catIdx, text) {
            catalogData[catIdx].categoryUz = text;
            saveToLocalStorage();
        }

        function updateItemName(catIdx, itemIdx, text) {
            catalogData[catIdx].items[itemIdx].uz = text;
            saveToLocalStorage();
        }

        function addNewItem(catIdx) {
            catalogData[catIdx].items.push({ uz: "Yangi mahsulot", price: 0, count: 0 });
            saveToLocalStorage();
            renderCatalog();
        }

        function deleteItem(catIdx, itemIdx) {
            catalogData[catIdx].items.splice(itemIdx, 1);
            saveToLocalStorage();
            renderCatalog();
        }

        function addNewCategory() {
            catalogData.push({
                categoryUz: "Yangi Kategoriya",
                items: []
            });
            saveToLocalStorage();
            renderCatalog();
        }

        function deleteCategory(catIdx) {
            if(confirm("Ushbu kategoriyani o'chirmoqchimisiz?")) {
                catalogData.splice(catIdx, 1);
                saveToLocalStorage();
                renderCatalog();
            }
        }

        function calculateGrandTotal() {
            let grandTotal = 0;

            catalogData.forEach(cat => {
                cat.items.forEach(item => {
                    const price = item.price || 0;
                    const count = item.count || 0;
                    if (count > 0) {
                        grandTotal += price * count;
                    }
                });
            });

            document.getElementById('grandTotal').innerText = grandTotal.toLocaleString() + " so'm";
        }

        function clearAllInputs() {
            catalogData.forEach(cat => {
                cat.items.forEach(item => {
                    item.count = 0;
                });
            });
            saveToLocalStorage();
            renderCatalog();
        }

        function sendToTelegram() {
            let selectedItems = [];
            let grandTotal = 0;
            let counter = 1;

            catalogData.forEach(cat => {
                cat.items.forEach(item => {
                    const count = item.count || 0;
                    const price = item.price || 0;
                    if (count > 0) {
                        const sum = count * price;
                        grandTotal += sum;
                        selectedItems.push(`${counter}. ${item.uz} — ${count} ta x ${price.toLocaleString()} = ${sum.toLocaleString()} so'm`);
                        counter++;
                    }
                });
            });

            if (selectedItems.length === 0) {
                alert("Telegramga jo'natish uchun kamida bitta mahsulot sonini kiriting!");
                return;
            }

            const today = new Date();
            const dateStr = today.toLocaleDateString('uz-UZ', { day: '2-digit', month: '2-digit', year: 'numeric' });

            let message = `📋 BUYURTMA RO'YXATI\n\n`;
            message += selectedItems.join("\n");
            message += `\n\n------------------------`;
            message += `\n💵 Jami: ${grandTotal.toLocaleString()} so'm`;
            message += `\n📅 Jo'natilgan sana: ${dateStr}.`;
            message += `\n\nJaloliddin do'koni`;
            message += `\n📞 Tel: +998999834444, +998999857070`;

            const encodedMessage = encodeURIComponent(message);
            window.open(`https://t.me/share/url?url=${encodedMessage}`, '_blank');
        }

        function saveToLocalStorage() {
            localStorage.setItem('catalogData', JSON.stringify(catalogData));
        }

        function downloadJSON() {
            const jsonString = JSON.stringify(catalogData, null, 4);
            const blob = new Blob([jsonString], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            const hours = String(today.getHours()).padStart(2, '0');
            const minutes = String(today.getMinutes()).padStart(2, '0');
            const seconds = String(today.getSeconds()).padStart(2, '0');
            
            const fileName = `baza_${year}-${month}-${day}_${hours}-${minutes}-${seconds}.json`;

            const downloadAnchor = document.createElement('a');
            downloadAnchor.href = url;
            downloadAnchor.download = fileName;
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            document.body.removeChild(downloadAnchor);
            URL.revokeObjectURL(url);
        }

        function uploadJSON(event) {
            const fileReader = new FileReader();
            fileReader.onload = function(e) {
                try {
                    const parsedData = JSON.parse(e.target.result);
                    if (Array.isArray(parsedData)) {
                        catalogData = parsedData;
                        saveToLocalStorage();
                        renderCatalog();
                        alert("Baza muvaffaqiyatli ochildi!");
                    } else {
                        alert("Fayl formati noto'g'ri!");
                    }
                } catch (err) {
                    alert("Baza faylini o'qishda xatolik ro'y berdi!");
                }
            };
            fileReader.readAsText(event.target.files[0]);
        }

        function searchProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const cards = document.querySelectorAll('.category-card');
            let totalVisible = 0;

            cards.forEach(card => {
                const rows = card.querySelectorAll('.product-row');
                let hasVisibleRow = false;

                rows.forEach(row => {
                    const nameUz = row.querySelector('.product-name').innerText.toLowerCase();
                    if (nameUz.includes(query)) {
                        row.classList.remove('hidden');
                        hasVisibleRow = true;
                        totalVisible++;
                    } else {
                        row.classList.add('hidden');
                    }
                });

                if (hasVisibleRow) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });

            document.getElementById('noResults').style.display = totalVisible === 0 ? 'block' : 'none';
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            searchProducts();
        }

        renderCatalog();
    </script>
</body>
</html>
